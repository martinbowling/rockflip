name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'Pillow>=12.1,<13'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m compileall -q art/src native/tools tests build.py
